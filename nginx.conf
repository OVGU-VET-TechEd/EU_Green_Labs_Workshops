# nginx.conf
# ──────────────────────────────────────────────────────────────────
# EduGreenLabs Workshop 3 — NGINX TLS proxy for institutional Ollama
#
# Features:
#   - HTTPS with TLS 1.2/1.3 only
#   - IP allowlist (restrict to institutional ranges)
#   - Long timeouts for AI inference (models can take minutes)
#   - Request size limit (for large prompts / documents)
#   - Security headers
#   - HTTP → HTTPS redirect
#   - Health endpoint (no auth required)
#
# Update before deploying:
#   1. Replace server_name with your actual hostname
#   2. Update allow/deny blocks with your institution's IP ranges
#   3. Point ssl_certificate/key to your real certificate paths
#
# Licence: MIT · EduGreenLabs / OvGU Magdeburg · EU-GREEN Alliance
# ──────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # ── Security defaults ───────────────────────────────────────────
    server_tokens off;          # Hide NGINX version
    client_max_body_size 50M;   # Max prompt/document size

    # ── HTTP → HTTPS redirect ───────────────────────────────────────
    server {
        listen 80;
        server_name ai-research.your-uni.de;   # ← UPDATE THIS

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name ai-research.your-uni.de;   # ← UPDATE THIS

        # TLS certificates — update paths to your real certs
        # For testing: generate with the openssl command in docker-compose.yml
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # TLS hardening
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── IP allowlist ─────────────────────────────────────────────
        # Only allow requests from institutional IP ranges.
        # UPDATE THESE with your partner institutions' IP ranges.
        #
        # Find your institution's IP ranges at:
        #   https://apps.db.ripe.net/db-web-ui/query

        # OvGU Magdeburg (example — verify actual range)
        allow 134.76.0.0/16;

        # UÉvora (example — verify actual range)
        allow 193.137.0.0/16;

        # University of Oradea (example — verify actual range)
        allow 193.226.0.0/16;

        # VPN / secure remote access (if your institution provides VPN)
        # allow 10.0.0.0/8;

        # Localhost (for Docker healthchecks)
        allow 127.0.0.1;
        allow ::1;

        # Block everything else
        deny all;

        # ── Health endpoint (no auth, no IP check) ──────────────────
        location = /health {
            allow all;
            access_log off;
            return 200 "EduGreenLabs AI Service — OK\n";
            add_header Content-Type text/plain;
        }

        # ── Ollama API proxy ─────────────────────────────────────────
        location / {
            proxy_pass         http://ollama:11434;

            # Headers
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Long timeouts — inference can take several minutes for large models
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            send_timeout           300s;

            # Buffer settings for streaming responses
            proxy_buffering        off;
            proxy_cache            off;
            proxy_http_version     1.1;
            chunked_transfer_encoding on;

            # Disable response buffering for streaming
            proxy_set_header Connection '';
        }

        # ── Block sensitive Ollama admin endpoints ───────────────────
        # These endpoints allow model deletion and config changes.
        # Only allow from localhost (Docker internal network).
        location ~ ^/api/(delete|pull|push|copy)$ {
            allow 172.0.0.0/8;    # Docker internal
            allow 127.0.0.1;
            deny all;
            proxy_pass http://ollama:11434;
        }
    }
}
